name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@main

    - name: Install az ml extension
      run: az extension add -n ml -y

    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}

    - name: Submit and Poll Azure Machine Learning training job
      run: |
        # 1. Submit job and capture the generated job name
        JOB_NAME=$(az ml job create -f src/job.yml \
          --resource-group ${{vars.AZURE_RESOURCE_GROUP}} \
          --workspace-name ${{vars.AZURE_WORKSPACE_NAME}} \
          --query name -o tsv)
        
        echo "Submitted Job Name: $JOB_NAME"
        
        # 2. Poll status until job completes or fails
        STATUS="Starting"
        while [[ "$STATUS" != "Completed" && "$STATUS" != "Failed" && "$STATUS" != "Canceled" ]]; do
          sleep 15
          STATUS=$(az ml job show --name $JOB_NAME \
            --resource-group ${{vars.AZURE_RESOURCE_GROUP}} \
            --workspace-name ${{vars.AZURE_WORKSPACE_NAME}} \
            --query status -o tsv)
          echo "Current Job Status: $STATUS"
        done
        
        # 3. Fail workflow if Azure ML job didn't complete successfully
        if [ "$STATUS" != "Completed" ]; then
          echo "Azure ML Job failed with status: $STATUS"
          exit 1
        fi